[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-rag-jev"
version = "0.1.0"
description = "Reproducible legal evidence selection experiments with Qdrant"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "qdrant-client>=1.14,<2", "httpx>=0.27,<1", "pydantic>=2.7,<3", "PyYAML>=6,<7", "python-dotenv>=1,<2", "tiktoken>=0.8,<1", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
local = ["sentence-transformers>=5,<6"]
documents = ["pypdf>=5,<7"]
test = ["pytest>=8,<10"]

[project.scripts]
legal-rag = "legal_rag_jev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legal_rag_jev = ["viewer_static/*", "viewer_static/fonts/*", "viewer_static/fonts/noto-serif-kr/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
