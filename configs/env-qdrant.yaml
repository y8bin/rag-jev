# Search the existing collection on QDRANT_BASE_URL using QDRANT_API_KEY.
# QDRANT_COLLECTION accepts comma-separated names; YAML qdrant_existing_collections overrides env.
# All selected collections must use the same embedding model, dimension, and distance.
qdrant_source: existing
qdrant_mode: remote
embedding_backend: local
ce_backend: local
jev_backend: http
generation_backend: openai
judge_backend: openai
methods: [vector, ce_r, jev_r]
top_k: 20
top_n: 5
cache_dir: .cache/env-qdrant
apply_metadata_filters: false # Existing payload metadata has not been mapped/validated.
max_output_tokens: 1000
temperature: null
